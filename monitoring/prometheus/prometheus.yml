# Prometheus configuration for the Docker Compose stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Application metrics from the payment API (/metrics via prom-client).
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]

  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Container CPU / memory metrics (used by the Grafana resource panels).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
