# Basic alert rules for the payment API.
groups:
  - name: payment-api-alerts
    rules:
      - alert: PaymentApiDown
        expr: up{job="payment-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Payment API target is down"
          description: "Prometheus cannot scrape the payment API for 1 minute."

      - alert: HighHttpErrorRate
        expr: |
          sum(rate(http_requests_total{job="payment-api",status=~"4..|5.."}[5m]))
            /
          clamp_min(sum(rate(http_requests_total{job="payment-api"}[5m])), 0.001)
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP error rate above 5%"
          description: "More than 5% of requests returned 4xx/5xx over the last 5 minutes."

      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="payment-api"}[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s"
          description: "95th percentile request latency has exceeded 1 second for 5 minutes."
