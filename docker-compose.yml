# Primary local demonstration stack:
#   app (backend + frontend), monitoring (Prometheus + Grafana + cAdvisor)
#
#   docker compose up -d --build
#
#   Dashboard : http://localhost:8080
#   API       : http://localhost:3000/api/payments
#   Metrics   : http://localhost:3000/metrics
#   Prometheus: http://localhost:9090
#   Grafana   : http://localhost:3001  (admin / admin — override with GRAFANA_ADMIN_PASSWORD)
#   cAdvisor  : http://localhost:8082

services:
  backend:
    build: ./backend
    image: payment-api:1.0
    container_name: payment-api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      SIM_FAILURE_PERCENT: "20"
      SIM_PENDING_PERCENT: "10"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: payment-frontend:1.0
    container_name: payment-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.4
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Default for local demos only. Override: set GRAFANA_ADMIN_PASSWORD in a .env file.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Container CPU / memory metrics for the Grafana resource panels.
  # Optional: omit with  docker compose up -d backend frontend prometheus grafana
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
