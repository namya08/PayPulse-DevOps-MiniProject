apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: payment-app
  labels:
    app: frontend
spec:
  # NodePort gives a stable demo URL on Minikube: nodeIP:30080
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
