apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: payment-app
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.4
          ports:
            - name: http
              containerPort: 3000
          env:
            # Demo defaults only — override in any shared environment.
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: storage
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        # Dashboard JSON comes from ConfigMap `grafana-dashboard`, generated
        # from the single source file monitoring/grafana/dashboards/payment-dashboard.json:
        #   kubectl apply -f k8s\monitoring\grafana-dashboard-configmap.yaml
        # (optional: true lets Grafana start before the ConfigMap exists)
        - name: dashboards
          configMap:
            name: grafana-dashboard
            optional: true
        - name: storage
          emptyDir: {}
